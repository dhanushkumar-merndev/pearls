<!DOCTYPE html>
<html>
<style>
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: stretch; border: 2px solid red; }
.left { background: lightblue; }
.right { background: lightgreen; height: 0; min-height: 100%; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; background: pink; }
</style>
<body>
<div class="split">
  <div class="left">
    <p>Line 1</p><p>Line 2</p><p>Line 3</p>
  </div>
  <div class="right">
    <div>Header</div>
    <div class="scroll">
      <p>R1</p><p>R2</p><p>R3</p><p>R4</p><p>R5</p><p>R6</p><p>R7</p>
    </div>
  </div>
</div>
</body>
</html>
